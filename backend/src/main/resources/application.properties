server.port=${SERVER_PORT:8080}
spring.application.name=recall
spring.datasource.url=jdbc:sqlite:${RECALL_DB_PATH:./data/recall.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.servlet.multipart.max-file-size=${RECALL_MAX_UPLOAD_MB:5}MB
spring.servlet.multipart.max-request-size=${RECALL_MAX_UPLOAD_MB:6}MB
recall.allowed-extensions=.txt,.md,.markdown
# "*" (default) suits the local/sandbox gateway where the browser origin is not
# known in advance. For a shared deployment restrict it, e.g.:
# RECALL_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
recall.cors.origins=${RECALL_CORS_ORIGINS:*}
recall.ai.api-key=${GROQ_API_KEY:}
recall.ai.model=${GROQ_MODEL:openai/gpt-oss-120b}
recall.ai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
